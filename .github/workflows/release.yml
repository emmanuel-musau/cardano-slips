name: Release

on:
  push:
    branches: [main]

# Publishing is the only thing here that writes outside the repository, so
# writes are granted per job rather than per workflow.
permissions:
  contents: read

concurrency:
  group: release
  # A cancelled publish leaves some packages on npm and some not, and npm
  # versions cannot be reused.
  cancel-in-progress: false

jobs:
  # Split from `publish` so versioning never runs with the npm environment's
  # OIDC identity.
  version:
    name: version PR
    runs-on: ubuntu-latest
    # This job's writes are authorised by the App token below, never by
    # `GITHUB_TOKEN`.
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}

    steps:
      # A PR opened with `GITHUB_TOKEN` does not trigger workflows, so the
      # version PR would never get its required checks. App setup and its
      # failure modes: docs/WORKFLOW.md.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Changesets reads history to work out what changed since the tag.
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      # Re-run on this commit rather than trusted from an earlier run. `publish`
      # needs this job, so one pass gates both versioning and publishing.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # `version` when changesets are pending, `publish` when none are and
      # there are publishable packages, `none` otherwise.
      - uses: changesets/action/select-mode@v2.1.1
        id: mode

      - if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@v2.1.1
        with:
          script: pnpm version:packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # `push-with-git-cli` stays at its default of false, so the commit
          # goes through the API: signed, and attributed to the App.
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          # @changesets/changelog-github reads this to resolve each changeset to
          # its PR; the action's own token input does not reach the script.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    name: publish
    needs: version
    # Merging the version PR is the release decision — it shows the exact bumps
    # being shipped — so there is no second approval here.
    if: needs.version.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    # npm mints a publish token only for this workflow in this environment,
    # which is restricted to main. It carries no reviewers.
    environment: npm
    permissions:
      contents: write # push tags, create GitHub releases
      id-token: write # OIDC token for npm trusted publishing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      # Trusted publishing needs npm 11.5.1+ and Node 22 bundles 10.x. Not 12:
      # it rejects the `--no-git-checks` flag changesets passes for workspaces.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # No NPM_TOKEN — auth is npm trusted publishing over OIDC, and provenance
      # comes with it.
      - uses: changesets/action/publish@v2.1.1
        with:
          script: pnpm release

  backmerge:
    name: back-merge into dev
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # `dev` is strictly behind `main` here. The refs API only fast-forwards
      # without `force`, so a `dev` that moved fails this job, not gets clobbered.
      - run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/dev" \
            -f sha=${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
