name: CI

on:
  pull_request:
  # `dev` takes commits directly, so a break there has to surface on the commit
  # that caused it rather than at merge time.
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main is never cancelled: its run history is the record of what was verified
  # before each merge, and a cancelled run leaves a hole in it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name == 'dev' }}

jobs:
  checks:
    # Four separately named checks rather than one job with four steps: a red X
    # names the failing gate, and branch protection can require them singly.
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]

    steps:
      - uses: actions/checkout@v7

      # `version` is omitted deliberately — pnpm/setup reads it from
      # `packageManager` in package.json, keeping CI and local on one pin.
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          # Installing in the next step instead keeps --frozen-lockfile visible
          # here rather than inherited from a CI-environment default.
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm ${{ matrix.task }}

  changeset:
    name: changeset
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # `status --since` diffs against the base branch, which needs history.
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      # Skipped on the version PR: it consumes the changesets while bumping the
      # packages, so it could never satisfy this gate.
      - run: pnpm exec changeset status --since=origin/${{ github.base_ref }}
