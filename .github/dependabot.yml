# Weekly dependency currency. Policy — why Dependabot, why no auto-merge — is in
# docs/WORKFLOW.md. Takes effect only once it is on the default branch.
version: 2

updates:
  # One entry for the whole workspace, not one per package. Split `directory`
  # entries over one pnpm workspace produce PRs that edit a manifest and leave
  # the root lockfile untouched (dependabot-core #11135), failing CI's
  # --frozen-lockfile.
  - package-ecosystem: npm
    directory: /

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Nairobi

    # Majors are left out on purpose: each gets its own PR and its own read of
    # the changelog, because each can break the build in a way a group hides.
    groups:
      npm:
        patterns: ["*"]
        update-types:
          - minor
          - patch

    # `increase` would ratchet every `^` floor on each bump, forcing a
    # resolution on consumers of the four packages we publish.
    versioning-strategy: increase-if-necessary

    # How long a release must survive before we are offered it. Security
    # updates ignore cooldown, which is the point of having it only here.
    cooldown:
      default-days: 5
      semver-major-days: 14

    open-pull-requests-limit: 5

    # Labels that do not exist are silently ignored, so this stays on the repo's
    # own taxonomy.
    labels:
      - infra

    commit-message:
      prefix: chore
      include: scope

  # Without this, actions quietly rot on whatever major they were pinned to —
  # including the ones that publish to npm.
  - package-ecosystem: github-actions
    directory: /

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Nairobi

    groups:
      actions:
        patterns: ["*"]
        update-types:
          - minor
          - patch

    # No `cooldown` here: the key is rejected for this ecosystem and invalidates
    # the whole file, taking the npm updates above with it.

    open-pull-requests-limit: 5

    labels:
      - infra

    commit-message:
      prefix: ci
      include: scope
